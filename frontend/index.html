<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Swipely — Live News</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#818cf8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Swipely">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg-start:#0a0e1a;--bg-mid:#0f1a2e;--bg-end:#0a1628;--b1:rgba(99,102,241,.35);--b2:rgba(168,85,247,.3);--b3:rgba(34,211,238,.25);--b4:rgba(16,185,129,.2);--gbg:rgba(255,255,255,.07);--gborder:rgba(255,255,255,.18);--gshine:rgba(255,255,255,.12);--gshadow:rgba(0,0,0,.4);--a1:#818cf8;--a2:#a78bfa;--tp:rgba(255,255,255,.95);--ts:rgba(255,255,255,.65);--tm:rgba(255,255,255,.4);--tbg:rgba(99,102,241,.2);--ta:#818cf8;--tagbg:rgba(99,102,241,.25);--tagc:#a5b4fc;--blur:28px;--cr:28px}
[data-theme=dusk]{--bg-start:#1a0a12;--bg-mid:#2a0f20;--bg-end:#1a0a18;--b1:rgba(244,63,94,.35);--b2:rgba(251,113,133,.28);--b3:rgba(249,168,212,.22);--b4:rgba(192,38,211,.2);--gbg:rgba(255,220,235,.07);--gborder:rgba(255,180,200,.2);--gshine:rgba(255,200,220,.12);--gshadow:rgba(80,0,30,.45);--a1:#fb7185;--a2:#f472b6;--tp:rgba(255,240,245,.95);--ts:rgba(255,200,220,.7);--tm:rgba(255,180,200,.45);--tbg:rgba(244,63,94,.2);--ta:#fb7185;--tagbg:rgba(244,63,94,.25);--tagc:#fda4af}
[data-theme=arctic]{--bg-start:#f0f4ff;--bg-mid:#e8f0fe;--bg-end:#f5f8ff;--b1:rgba(99,102,241,.15);--b2:rgba(59,130,246,.12);--b3:rgba(34,211,238,.1);--b4:rgba(16,185,129,.08);--gbg:rgba(255,255,255,.55);--gborder:rgba(255,255,255,.85);--gshine:rgba(255,255,255,.7);--gshadow:rgba(100,120,200,.15);--a1:#6366f1;--a2:#3b82f6;--tp:rgba(15,23,42,.95);--ts:rgba(30,40,80,.65);--tm:rgba(30,40,80,.4);--tbg:rgba(99,102,241,.12);--ta:#6366f1;--tagbg:rgba(99,102,241,.12);--tagc:#4f46e5;--blur:24px}
[data-theme=ember]{--bg-start:#0f0a00;--bg-mid:#1a1000;--bg-end:#120c00;--b1:rgba(251,146,60,.4);--b2:rgba(245,101,26,.3);--b3:rgba(252,211,77,.25);--b4:rgba(239,68,68,.2);--gbg:rgba(255,200,100,.07);--gborder:rgba(255,180,60,.2);--gshine:rgba(255,200,100,.12);--gshadow:rgba(80,30,0,.5);--a1:#fb923c;--a2:#fbbf24;--tp:rgba(255,245,230,.95);--ts:rgba(255,200,140,.7);--tm:rgba(255,180,100,.45);--tbg:rgba(251,146,60,.2);--ta:#fb923c;--tagbg:rgba(251,146,60,.22);--tagc:#fdba74}
[data-theme=obsidian]{--bg-start:#080808;--bg-mid:#0d0d0d;--bg-end:#060606;--b1:rgba(200,200,210,.12);--b2:rgba(150,150,160,.08);--b3:rgba(180,180,190,.06);--b4:rgba(120,120,130,.05);--gbg:rgba(255,255,255,.05);--gborder:rgba(255,255,255,.1);--gshine:rgba(255,255,255,.06);--gshadow:rgba(0,0,0,.6);--a1:#e2e8f0;--a2:#94a3b8;--tp:rgba(255,255,255,.9);--ts:rgba(255,255,255,.5);--tm:rgba(255,255,255,.28);--tbg:rgba(255,255,255,.07);--ta:#cbd5e1;--tagbg:rgba(255,255,255,.08);--tagc:#94a3b8;--blur:32px}
html,body{height:100%;font-family:-apple-system,'Helvetica Neue',sans-serif;background:var(--bg-start);color:var(--tp);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.bg-canvas{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 20% 20%,var(--bg-mid),transparent 60%),radial-gradient(ellipse at 80% 80%,var(--bg-end),transparent 60%),var(--bg-start);transition:background .6s}
.blob{position:absolute;border-radius:50%;filter:blur(60px);will-change:transform;transition:background .6s}
.blob-1{width:500px;height:500px;background:var(--b1);top:-100px;left:-150px;animation:d1 18s ease-in-out infinite}
.blob-2{width:400px;height:400px;background:var(--b2);top:40%;right:-100px;animation:d2 22s ease-in-out infinite}
.blob-3{width:350px;height:350px;background:var(--b3);bottom:-100px;left:30%;animation:d3 16s ease-in-out infinite}
.blob-4{width:280px;height:280px;background:var(--b4);top:25%;left:40%;animation:d4 25s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0)scale(1)}33%{transform:translate(60px,40px)scale(1.1)}66%{transform:translate(-30px,70px)scale(.95)}}
@keyframes d2{0%,100%{transform:translate(0,0)scale(1)}33%{transform:translate(-80px,-50px)scale(1.08)}66%{transform:translate(40px,60px)scale(.92)}}
@keyframes d3{0%,100%{transform:translate(0,0)scale(1)}33%{transform:translate(50px,-40px)scale(1.12)}66%{transform:translate(-60px,30px)scale(.97)}}
@keyframes d4{0%,100%{transform:translate(0,0)scale(1)}50%{transform:translate(-70px,-60px)scale(1.15)}}
#app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.nav{height:76px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:relative;z-index:100;background:var(--gbg);backdrop-filter:blur(var(--blur)) saturate(180%);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);border-bottom:1px solid var(--gborder)}
.nav-logo{display:flex;align-items:center;gap:9px}
.logo-icon{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 4px 14px rgba(0,0,0,.3)}
.logo-text{font-size:22px;font-weight:700;letter-spacing:-.5px;background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nav-right{display:flex;align-items:center;gap:7px;position:relative}
.live-pill{display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#ef4444}
.ldot{width:5px;height:5px;background:#ef4444;border-radius:50%;animation:ld 1.4s infinite}
@keyframes ld{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.theme-btn{width:36px;height:36px;border-radius:11px;border:1px solid var(--gborder);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--gbg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--tp);transition:transform .2s}
.theme-btn:active{transform:scale(.9)}
.tp{position:absolute;top:calc(100% + 10px);right:0;width:205px;border-radius:18px;padding:7px;z-index:200;transform-origin:top right;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .25s;background:rgba(20,20,40,0.95);backdrop-filter:blur(var(--blur)) saturate(180%);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);border:1px solid var(--gborder);box-shadow:0 8px 36px var(--gshadow)}
.tp.hide{transform:scale(.8);opacity:0;pointer-events:none}
.tp-lbl{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--tm);padding:3px 7px 7px}
.tp-opt{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:11px;cursor:pointer;border:none;background:transparent;color:var(--tp);width:100%;text-align:left;transition:background .15s}
.tp-opt:hover{background:var(--gshine)}
.tp-sw{width:22px;height:22px;border-radius:6px;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tp-name{font-size:13px;font-weight:500;flex:1}
.tp-ck{font-size:12px;color:var(--a1)}
.ticker{flex-shrink:0;margin:0 14px 10px;border-radius:12px;overflow:hidden;background:var(--tbg);border:1px solid var(--gborder);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);height:35px;display:flex;align-items:center}
.t-lbl{flex-shrink:0;padding:0 11px;font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ta);border-right:1px solid var(--gborder);height:100%;display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.1);white-space:nowrap}
.t-area{flex:1;overflow:hidden}
.t-track{display:flex;white-space:nowrap;will-change:transform;animation:tick 20s linear infinite}
.t-track:hover{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.t-item{display:inline-flex;align-items:center;padding:0 22px;font-size:12px;color:var(--ts)}
.t-item::after{content:'•';margin-left:22px;color:var(--a1)}
.cats{flex-shrink:0;display:flex;gap:6px;padding:0 14px 11px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--gborder);background:var(--gbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ts);transition:all .22s;white-space:nowrap}
.cat.active{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.viewport{flex:1;position:relative;overflow:hidden;padding:0 14px}
.stack{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.hint{position:absolute;top:50%;transform:translateY(-50%);pointer-events:none;opacity:0;z-index:20;padding:8px 13px;border-radius:13px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.2);transition:opacity .1s}
.hl{left:14px;background:rgba(239,68,68,.4);color:#fff}
.hr{right:14px;background:rgba(34,197,94,.4);color:#fff}
.card{position:absolute;width:100%;max-width:420px;border-radius:var(--cr);overflow:hidden;cursor:grab;will-change:transform;touch-action:pan-y;transform-origin:center bottom}
.card:active{cursor:grabbing}
.card[data-p="0"]{transform:translateY(0)scale(1);z-index:10}
.card[data-p="1"]{transform:translateY(26px)scale(.95);z-index:9;transition:transform .4s cubic-bezier(.34,1.2,.64,1)}
.card[data-p="2"]{transform:translateY(46px)scale(.91);z-index:8;transition:transform .4s cubic-bezier(.34,1.2,.64,1) .05s}
.card[data-p="3"]{transform:translateY(62px)scale(.87);z-index:7;pointer-events:none;transition:transform .4s cubic-bezier(.34,1.2,.64,1) .1s}
.card[data-p="4"]{transform:translateY(74px)scale(.84);z-index:6;pointer-events:none;transition:transform .4s cubic-bezier(.34,1.2,.64,1) .15s}
.card-inner{background:var(--gbg);backdrop-filter:blur(var(--blur)) saturate(200%);-webkit-backdrop-filter:blur(var(--blur)) saturate(200%);border:1px solid var(--gborder);border-radius:var(--cr);overflow:hidden;box-shadow:0 8px 40px var(--gshadow),inset 0 2px 0 var(--gshine),inset 0 0 0 .5px rgba(255,255,255,.04);transition:background .6s,border-color .6s}
.cimg{position:relative;height:205px;overflow:hidden;background:var(--gbg)}
.cimg img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card[data-p="0"] .cimg img:hover{transform:scale(1.03)}
.cimg-ov{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 35%,rgba(0,0,0,.55) 100%)}
.cat-badge{position:absolute;top:12px;left:12px;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;background:var(--tagbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--tagc);border:1px solid rgba(255,255,255,.13)}
.src-badge{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:20px;font-size:10px;font-weight:600;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.12);max-width:160px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cbody{padding:15px 16px 16px}
.c-hl{font-size:16px;font-weight:700;line-height:1.35;letter-spacing:-.2px;color:var(--tp);margin-bottom:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-desc{font-size:12.5px;line-height:1.55;color:var(--ts);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:13px}
.c-foot{display:flex;align-items:center;justify-content:space-between}
.c-src{display:flex;align-items:center;gap:6px}
.c-av{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.c-sn{font-size:11px;font-weight:600;color:var(--tm)}
.c-acts{display:flex;gap:6px}
.c-act{width:29px;height:29px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--gbg);border:1px solid var(--gborder);backdrop-filter:blur(10px);cursor:pointer;transition:transform .15s;color:var(--ts);text-decoration:none}
.c-act:active{transform:scale(.82)}
.dots{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 14px 7px}
.dot{width:5px;height:5px;border-radius:3px;background:var(--tm);transition:all .3s}
.dot.on{width:18px;background:var(--a1)}
.loading{display:flex;flex-direction:column;align-items:center;gap:13px;color:var(--ts);padding:30px;width:100%}
.spin{width:34px;height:34px;border:2px solid var(--gborder);border-top-color:var(--a1);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:13px;color:var(--tm)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 18px;text-align:center;width:100%;background:var(--gbg);border:1px solid var(--gborder);border-radius:var(--cr);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
.empty-icon{font-size:40px}
.empty-title{font-size:17px;font-weight:700;color:var(--tp)}
.empty-sub{font-size:12px;color:var(--tm)}
.empty-btn{margin-top:5px;padding:10px 24px;border-radius:13px;font-size:13px;font-weight:600;border:none;cursor:pointer;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;transition:transform .2s}
.empty-btn:active{transform:scale(.95)}
/* SAVED LIST */
.saved-list{flex:1;overflow-y:auto;padding:0 14px;display:flex;flex-direction:column;gap:10px}
.saved-item{background:var(--gbg);border:1px solid var(--gborder);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.saved-img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex-shrink:0}
.saved-info{flex:1;min-width:0}
.saved-cat{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--a1);margin-bottom:4px}
.saved-title{font-size:13px;font-weight:600;color:var(--tp);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.saved-src{font-size:11px;color:var(--tm);margin-top:4px}
.saved-open{width:28px;height:28px;border-radius:8px;background:var(--gbg);border:1px solid var(--gborder);display:flex;align-items:center;justify-content:center;font-size:12px;text-decoration:none;flex-shrink:0}
/* SEARCH */
.search-wrap{padding:0 14px 10px;flex-shrink:0}
.search-box{width:100%;padding:11px 16px;border-radius:14px;border:1px solid var(--gborder);background:var(--gbg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--tp);font-size:14px;outline:none}
.search-box::placeholder{color:var(--tm)}
.search-results{flex:1;overflow-y:auto;padding:0 14px;display:flex;flex-direction:column;gap:10px}
/* TABBAR */
.tabbar{flex-shrink:0;margin:4px 14px 16px;border-radius:20px;padding:8px 14px;display:flex;justify-content:space-around;align-items:center;background:var(--gbg);backdrop-filter:blur(var(--blur)) saturate(180%);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);border:1px solid var(--gborder);box-shadow:0 4px 28px var(--gshadow),inset 0 1px 0 var(--gshine)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:3px 10px;border-radius:12px;transition:all .2s}
.tab.active{background:rgba(255,255,255,.08)}
.tab-icon{font-size:19px;line-height:1;transition:transform .2s}
.tab.active .tab-icon{transform:scale(1.1)}
.tab-lbl{font-size:9px;font-weight:600;color:var(--tm);letter-spacing:.3px}
.tab.active .tab-lbl{color:var(--a1)}
.footer{text-align:center;padding:0 14px 5px;font-size:10px;color:var(--tm);flex-shrink:0}
.footer a{color:var(--a1);text-decoration:none;font-weight:600}
.toast{position:fixed;bottom:108px;left:50%;transform:translateX(-50%);padding:9px 16px;border-radius:13px;font-size:12px;font-weight:600;backdrop-filter:blur(16px);z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;border:1px solid rgba(255,255,255,.2)}
.toast.err{background:rgba(239,68,68,.85);color:#fff}
.toast.ok{background:rgba(34,197,94,.85);color:#fff}
.toast.show{opacity:1}
.section-title{font-size:13px;font-weight:700;color:var(--tm);padding:4px 0 8px;letter-spacing:.4px;text-transform:uppercase}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div class="bg-canvas">
  <div class="blob blob-1"></div><div class="blob blob-2"></div>
  <div class="blob blob-3"></div><div class="blob blob-4"></div>
</div>
<div id="app">
  <nav class="nav">
    <div class="nav-logo">
      <div class="logo-icon"><img src="icons/icon-192.png" alt="Swipely" style="width:100%;height:100%;object-fit:cover;border-radius:11px;"></div>
      <span class="logo-text">Swipely</span>
    </div>
    <div class="nav-right">
      <div class="live-pill"><div class="ldot"></div>LIVE</div>
      <button class="theme-btn" id="themeBtn">🎨</button>
      <div class="tp hide" id="themePanel">
        <div class="tp-lbl">Theme</div>
        <button class="tp-opt" onclick="setTheme('',this)"><div class="tp-sw" style="background:linear-gradient(135deg,#6366f1,#a78bfa)"></div><span class="tp-name">Aurora</span><span class="tp-ck">✓</span></button>
        <button class="tp-opt" onclick="setTheme('dusk',this)"><div class="tp-sw" style="background:linear-gradient(135deg,#fb7185,#f472b6)"></div><span class="tp-name">Dusk Rose</span><span class="tp-ck" style="opacity:0">✓</span></button>
        <button class="tp-opt" onclick="setTheme('arctic',this)"><div class="tp-sw" style="background:linear-gradient(135deg,#6366f1,#3b82f6)"></div><span class="tp-name">Arctic</span><span class="tp-ck" style="opacity:0">✓</span></button>
        <button class="tp-opt" onclick="setTheme('ember',this)"><div class="tp-sw" style="background:linear-gradient(135deg,#fb923c,#fbbf24)"></div><span class="tp-name">Ember</span><span class="tp-ck" style="opacity:0">✓</span></button>
        <button class="tp-opt" onclick="setTheme('obsidian',this)"><div class="tp-sw" style="background:linear-gradient(135deg,#334155,#1e293b)"></div><span class="tp-name">Obsidian</span><span class="tp-ck" style="opacity:0">✓</span></button>
      </div>
    </div>
  </nav>
  <div class="ticker">
    <div class="t-lbl"><div class="ldot"></div>BREAKING</div>
    <div class="t-area"><div class="t-track" id="tickerTrack"><span class="t-item">Connecting to live sources...</span></div></div>
  </div>
  <div class="cats" id="catRow">
    <button class="cat active" onclick="setCat('All',this)">All</button>
    <button class="cat" onclick="setCat('World',this)">🌍 World</button>
    <button class="cat" onclick="setCat('India',this)">🇮🇳 India</button>
    <button class="cat" onclick="setCat('Tech',this)">💻 Tech</button>
    <button class="cat" onclick="setCat('Business',this)">📈 Business</button>
    <button class="cat" onclick="setCat('Science',this)">🔬 Science</button>
    <button class="cat" onclick="setCat('Sports',this)">⚽ Sports</button>
    <button class="cat" onclick="setCat('Culture',this)">🎬 Culture</button>
    <button class="cat" onclick="setCat('Health',this)">🏥 Health</button>
  </div>

  <!-- FOR YOU / FEED VIEW -->
  <div id="feedView" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
    <div class="viewport">
      <div class="hint hl" id="hintL">👎 Skip</div>
      <div class="hint hr" id="hintR">❤️ Save</div>
      <div class="stack" id="stack">
        <div class="loading"><div class="spin"></div><p>Fetching live news...</p></div>
      </div>
    </div>
    <div class="dots" id="dots"></div>
  </div>

  <!-- TRENDING VIEW -->
  <div id="trendingView" style="flex:1;display:none;flex-direction:column;overflow:hidden;padding:0 14px">
    <div class="section-title">🔥 Trending Now</div>
    <div class="saved-list" id="trendingList"></div>
  </div>

  <!-- SAVED VIEW -->
  <div id="savedView" style="flex:1;display:none;flex-direction:column;overflow:hidden;padding:0 14px">
    <div class="section-title">🔖 Saved Articles</div>
    <div class="saved-list" id="savedList"></div>
  </div>

  <!-- SEARCH VIEW -->
  <div id="searchView" style="flex:1;display:none;flex-direction:column;overflow:hidden">
    <div class="search-wrap">
      <input class="search-box" id="searchBox" type="text" placeholder="🔍 Search news..." oninput="doSearch(this.value)">
    </div>
    <div class="search-results" id="searchResults">
      <div style="text-align:center;color:var(--tm);padding:40px 20px;font-size:13px;">Type to search news...</div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab active" id="tab-foryou" onclick="switchTab('foryou',this)"><div class="tab-icon">✨</div><div class="tab-lbl">For You</div></div>
    <div class="tab" id="tab-trending" onclick="switchTab('trending',this)"><div class="tab-icon">🔥</div><div class="tab-lbl">Trending</div></div>
    <div class="tab" id="tab-saved" onclick="switchTab('saved',this)"><div class="tab-icon">🔖</div><div class="tab-lbl">Saved</div></div>
    <div class="tab" id="tab-search" onclick="switchTab('search',this)"><div class="tab-icon">🔍</div><div class="tab-lbl">Search</div></div>
  </div>
  <div class="footer">Built with ❤️ by <a href="https://prashantbhatt.net" target="_blank">Prashant Bhatt</a></div>
</div>
<div class="toast" id="toast"></div>

<!-- ONBOARD -->
<div id="onboard" style="position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;">
  <svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" style="animation:obFade 0.6s ease 4s forwards;filter:drop-shadow(0 2px 12px rgba(0,0,0,0.3));"><style>@keyframes obFadeEl{to{opacity:0}}.hand{animation:swipeHand 1.8s ease-in-out infinite}.arr{animation:arrowPulse 1.8s ease-in-out infinite}@keyframes swipeHand{0%{transform:translateX(28px)}50%{transform:translateX(-28px)}100%{transform:translateX(28px)}}@keyframes arrowPulse{0%,100%{opacity:0.3}50%{opacity:1}}</style><g class="hand"><path d="M80 60 C80 60 72 52 68 56 C64 60 68 68 68 68 L64 66 C60 64 56 66 56 70 C56 74 58 76 58 76 L56 75 C52 73 48 76 48 80 C48 84 52 88 52 88 L56 96 C60 106 68 112 80 112 C92 112 104 104 104 90 L104 70 C104 66 100 62 96 62 C94 62 92 63 91 65 C90 62 87 60 84 60 C82 60 81 61 80 62 L80 60Z" stroke="white" stroke-width="3" stroke-linejoin="round" fill="rgba(255,255,255,0.15)"/></g><g class="arr"><line x1="22" y1="72" x2="42" y2="72" stroke="white" stroke-width="2.5" stroke-linecap="round"/><polyline points="28,64 20,72 28,80" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="arr"><line x1="118" y1="72" x2="138" y2="72" stroke="white" stroke-width="2.5" stroke-linecap="round"/><polyline points="132,64 140,72 132,80" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></svg>
  <div style="color:white;font-size:13px;font-weight:600;letter-spacing:1px;opacity:0.8;margin-top:12px;text-transform:uppercase;animation:obFade 0.6s ease 4s forwards;">Swipe to explore</div>
</div>
<style>@keyframes obFade{0%{opacity:1}100%{opacity:0}}</style>

<script>
const API="";
const REFRESH=3600*1000;
let articles=[],filtered=[],topIdx=0,currentCat="All";
let saved=new Map();
let dragCard=null,dragging=false,startX=0,startY=0,curX=0;
let currentTab="foryou";

async function loadNews(){
  try{
    const q=new URLSearchParams({category:currentCat,limit:80});
    const r=await fetch(`${API}/api/news?${q}`,{signal:AbortSignal.timeout(8000)});
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    articles=d.articles||[];
    applyFilter();renderCards();renderDots();
  }catch(e){showToast("Backend offline","err");useFallback();}
}

async function loadBreaking(){
  try{
    const r=await fetch(`${API}/api/breaking`,{signal:AbortSignal.timeout(6000)});
    const d=await r.json();
    renderTicker(d.items||[]);
  }catch{renderTicker(["🔴 Live feed loading..."]);}
}

function applyFilter(){
  filtered=articles;
  if(currentCat!=="All")filtered=filtered.filter(a=>a.category===currentCat);
  topIdx=0;
}

function renderTicker(items){
  const d=[...items,...items];
  document.getElementById("tickerTrack").innerHTML=d.map(t=>`<span class="t-item">${t}</span>`).join("");
}

function renderCards(){
  const stack=document.getElementById("stack");
  stack.innerHTML="";
  const vis=filtered.slice(topIdx,topIdx+5);
  if(!vis.length){
    stack.innerHTML=`<div class="empty"><div class="empty-icon">🎉</div><div class="empty-title">All caught up!</div><div class="empty-sub">${filtered.length===0?"No stories match":"You've seen everything"}</div><button class="empty-btn" onclick="resetFeed()">↺ Refresh</button></div>`;
    return;
  }
  vis.forEach((item,i)=>stack.appendChild(makeCard(item,i)));
  const top=stack.querySelector('[data-p="0"]');
  if(top)setupDrag(top);
}

function makeCard(item,pos){
  const el=document.createElement("div");
  el.className="card";el.dataset.p=pos;el.dataset.id=item.id;
  const isSaved=saved.has(item.id);
  el.innerHTML=`<div class="card-inner"><div class="cimg"><img src="${item.img}" alt="" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=600&q=80'"><div class="cimg-ov"></div><div class="cat-badge">${item.category}</div><div class="src-badge">▲ ${item.source} · ${item.time}</div></div><div class="cbody"><div class="c-hl">${item.headline}</div><div class="c-desc">${item.desc}</div><div class="c-foot"><div class="c-src"><div class="c-av" style="background:${item.color}">${item.source[0].toUpperCase()}</div><span class="c-sn">${item.source}</span></div><div class="c-acts"><div class="c-act" id="sv-${item.id}" onclick="event.stopPropagation();doSave(${item.id})">${isSaved?"✅":"🔖"}</div><a class="c-act" href="${item.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">↗️</a></div></div></div></div>`;
  return el;
}

function renderDots(){
  const n=Math.min(filtered.length,8);
  document.getElementById("dots").innerHTML=Array.from({length:n},(_,i)=>`<div class="dot${i===topIdx%Math.max(n,1)?" on":""}"></div>`).join("");
}

function updateDots(){
  const dots=document.querySelectorAll(".dot");
  dots.forEach((d,i)=>d.classList.toggle("on",i===topIdx%Math.max(dots.length,1)));
}

// DRAG
function setupDrag(card){
  dragCard=card;
  card.addEventListener("touchstart",ds,{passive:true});
  card.addEventListener("touchmove",dm,{passive:false});
  card.addEventListener("touchend",de);
  card.addEventListener("mousedown",ds);
  window.addEventListener("mousemove",dm);
  window.addEventListener("mouseup",de);
}
function gx(e){return e.touches?e.touches[0].clientX:e.clientX}
function gy(e){return e.touches?e.touches[0].clientY:e.clientY}
function ds(e){if(e.type!=="touchstart"&&e.button!==0)return;dragging=true;startX=gx(e);startY=gy(e);curX=0;if(dragCard)dragCard.style.transition="none";}
function dm(e){if(!dragging)return;const dx=gx(e)-startX,dy=gy(e)-startY;if(Math.abs(dx)>Math.abs(dy)&&e.cancelable)e.preventDefault();curX=dx;if(dragCard)dragCard.style.transform=`translateX(${dx}px) rotate(${dx*.08}deg) translateY(${-Math.abs(dx)*.07}px)`;const T=60,hl=document.getElementById("hintL"),hr=document.getElementById("hintR");if(dx<-T){hl.style.opacity=Math.min(1,(Math.abs(dx)-T)/60);hr.style.opacity=0;}else if(dx>T){hr.style.opacity=Math.min(1,(dx-T)/60);hl.style.opacity=0;}else{hl.style.opacity=0;hr.style.opacity=0;}}
function de(){if(!dragging)return;dragging=false;window.removeEventListener("mousemove",dm);window.removeEventListener("mouseup",de);document.getElementById("hintL").style.opacity=0;document.getElementById("hintR").style.opacity=0;if(Math.abs(curX)>90)swipe(curX>0?"right":"left");else if(dragCard){dragCard.style.transition="transform .4s cubic-bezier(.34,1.56,.64,1)";dragCard.style.transform="translateY(0) scale(1)";}}
function swipe(dir){
  if(!dragCard)return;
  const card=dragCard;
  const item=filtered[topIdx];
  if(dir==="right"&&item) doSave(item.id);
  card.style.transition="transform .42s cubic-bezier(.55,0,1,.5),opacity .42s";
  card.style.transform=dir==="left"?"translateX(-160%) rotate(-20deg)":"translateX(160%) rotate(20deg)";
  card.style.opacity="0";
  setTimeout(()=>{card.remove();topIdx++;renderCards();updateDots();},400);
}

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"){dragCard=document.querySelector('[data-p="0"]');if(dragCard){curX=-110;swipe("left");}}
  if(e.key==="ArrowRight"){dragCard=document.querySelector('[data-p="0"]');if(dragCard){curX=110;swipe("right");}}
});

// SAVE
function doSave(id){
  const item=articles.find(a=>a.id===id);
  if(!item)return;
  if(saved.has(id)){
    saved.delete(id);
    const el=document.getElementById(`sv-${id}`);
    if(el)el.textContent="🔖";
    showToast("Removed from saved","err");
  } else {
    saved.set(id,item);
    const el=document.getElementById(`sv-${id}`);
    if(el)el.textContent="✅";
    showToast("Saved! 🔖","ok");
  }
}

function resetFeed(){topIdx=0;renderCards();renderDots();}

function setCat(cat,el){
  currentCat=cat;
  document.querySelectorAll(".cat").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  applyFilter();
  if(currentTab==="foryou"){renderCards();renderDots();}
  else if(currentTab==="trending"){renderTrending();}
  else if(currentTab==="search"){doSearch(document.getElementById("searchBox").value);}
}

// TABS
function switchTab(tab,el){
  currentTab=tab;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  document.getElementById("feedView").style.display="none";
  document.getElementById("trendingView").style.display="none";
  document.getElementById("savedView").style.display="none";
  document.getElementById("searchView").style.display="none";
  if(tab==="foryou"){document.getElementById("feedView").style.display="flex";renderCards();renderDots();}
  else if(tab==="trending"){document.getElementById("trendingView").style.display="flex";renderTrending();}
  else if(tab==="saved"){document.getElementById("savedView").style.display="flex";renderSaved();}
  else if(tab==="search"){document.getElementById("searchView").style.display="flex";setTimeout(()=>document.getElementById("searchBox").focus(),100);}
}

// TRENDING
function renderTrending(){
  const list=document.getElementById("trendingList");
  let arts=articles.slice().sort((a,b)=>b.score-a.score||b.time_ts-a.time_ts);
  if(currentCat!=="All") arts=arts.filter(a=>a.category===currentCat);
  if(!arts.length){list.innerHTML=`<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">No trending news</div></div>`;return;}
  list.innerHTML=arts.slice(0,30).map(item=>`
    <div class="saved-item">
      <img class="saved-img" src="${item.img}" onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=600&q=80'">
      <div class="saved-info">
        <div class="saved-cat">${item.category}</div>
        <div class="saved-title">${item.headline}</div>
        <div class="saved-src">${item.source} · ${item.time}</div>
      </div>
      <a class="saved-open" href="${item.url}" target="_blank" rel="noopener">↗️</a>
    </div>`).join("");
}

// SAVED
function renderSaved(){
  const list=document.getElementById("savedList");
  const items=[...saved.values()];
  if(!items.length){list.innerHTML=`<div class="empty"><div class="empty-icon">🔖</div><div class="empty-title">No saved articles</div><div class="empty-sub">Swipe right to save news</div></div>`;return;}
  list.innerHTML=items.map(item=>`
    <div class="saved-item">
      <img class="saved-img" src="${item.img}" onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=600&q=80'">
      <div class="saved-info">
        <div class="saved-cat">${item.category}</div>
        <div class="saved-title">${item.headline}</div>
        <div class="saved-src">${item.source} · ${item.time}</div>
      </div>
      <a class="saved-open" href="${item.url}" target="_blank" rel="noopener">↗️</a>
    </div>`).join("");
}

// SEARCH
function doSearch(q){
  const res=document.getElementById("searchResults");
  if(!q.trim()){res.innerHTML=`<div style="text-align:center;color:var(--tm);padding:40px 20px;font-size:13px;">Type to search news...</div>`;return;}
  const matches=articles.filter(a=>
    a.headline.toLowerCase().includes(q.toLowerCase())||
    a.desc.toLowerCase().includes(q.toLowerCase())||
    a.source.toLowerCase().includes(q.toLowerCase())||
    a.category.toLowerCase().includes(q.toLowerCase())
  );
  if(!matches.length){res.innerHTML=`<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">No results</div><div class="empty-sub">Try different keywords</div></div>`;return;}
  res.innerHTML=matches.map(item=>`
    <div class="saved-item">
      <img class="saved-img" src="${item.img}" onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=600&q=80'">
      <div class="saved-info">
        <div class="saved-cat">${item.category}</div>
        <div class="saved-title">${item.headline}</div>
        <div class="saved-src">${item.source} · ${item.time}</div>
      </div>
      <a class="saved-open" href="${item.url}" target="_blank" rel="noopener">↗️</a>
    </div>`).join("");
}

// THEME
document.getElementById("themeBtn").addEventListener("click",e=>{e.stopPropagation();document.getElementById("themePanel").classList.toggle("hide");});
document.addEventListener("click",e=>{const p=document.getElementById("themePanel");if(!p.contains(e.target)&&e.target!==document.getElementById("themeBtn"))p.classList.add("hide");});
function setTheme(t,el){document.documentElement.dataset.theme=t;document.querySelectorAll(".tp-ck").forEach(c=>c.style.opacity="0");el.querySelector(".tp-ck").style.opacity="1";setTimeout(()=>document.getElementById("themePanel").classList.add("hide"),260);}

// TOAST
function showToast(msg,type="ok"){const t=document.getElementById("toast");t.textContent=msg;t.className=`toast ${type} show`;setTimeout(()=>t.classList.remove("show"),3000);}

// FALLBACK
function useFallback(){articles=[{id:1,source:"RSS",source_type:"rss",category:"Tech",headline:"Backend offline — check VPS",desc:"Run: sudo systemctl restart swipely",img:"https://images.unsplash.com/photo-1518770660439-4636190af475?w=600&q=80",time:"now",time_ts:Date.now()/1000,color:"#6366f1",score:0,comments:0,url:"#"}];applyFilter();renderCards();renderDots();}

(async function(){
  await Promise.all([loadNews(),loadBreaking()]);
  setInterval(()=>{loadNews();loadBreaking();},REFRESH);
})();
// PWA: register service worker
if("serviceWorker" in navigator){
window.addEventListener("load",()=>{
navigator.serviceWorker.register("sw.js").catch(err=>console.warn("SW registration failed:",err));
});
}
</script>
</body>
</html>
